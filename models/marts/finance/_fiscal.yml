version: 2
seeds:
  - name: demo_fiscal_targets
    description: "Invented department/month targets for an original February-start fiscal demonstration. Not employer budgets."
    config:
      column_types:
        month_start: date
        department: string
        target_cents: int64
    columns:
      - name: month_start
        tests: [not_null]
      - name: department
        tests: [not_null]
      - name: target_cents
        tests: [not_null]
models:
  - name: mart_fiscal_attainment
    description: "Completed February-April 2026 item cohort by month/department, including empty and unplanned buckets. Current-source retained order value is not cash or GAAP revenue; margin uses current product cost. Targets are invented."
    columns:
      - name: month_start
        tests: [not_null]
      - name: department
        tests: [not_null]
      - name: retained_value_cents
        tests: [not_null]
